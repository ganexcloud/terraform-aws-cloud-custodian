name: Validate Terraform module

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        terraform_version: ["1.6.0", "1.15.8"]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ matrix.terraform_version }}
          terraform_wrapper: false
      - uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: v0.58.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation tools
        run: pipx install pre-commit checkov
      - name: Exclude native tests on Terraform 1.6
        if: matrix.terraform_version == '1.6.0'
        run: mv tests /tmp/terraform-tests-disabled
      - name: Install AWS provider locally for Terraform 1.6
        if: matrix.terraform_version == '1.6.0'
        run: |
          mkdir -p /tmp/terraform-provider-plugins
          curl -fsSL https://releases.hashicorp.com/terraform-provider-aws/6.58.0/terraform-provider-aws_6.58.0_linux_amd64.zip -o /tmp/aws-provider.zip
          unzip -q /tmp/aws-provider.zip -d /tmp/terraform-provider-plugins
      - name: Validate root module
        run: |
          terraform fmt -check -recursive
          if [ "${{ matrix.terraform_version }}" = "1.6.0" ]; then
            terraform init -backend=false -plugin-dir=/tmp/terraform-provider-plugins
          else
            terraform init -backend=false
          fi
          terraform validate
          tflint --init
          tflint --recursive
          checkov -d . --quiet
          pre-commit run --all-files
      - name: Validate example
        working-directory: examples/complete
        run: |
          terraform init -backend=false
          terraform validate
      - name: Run native tests
        if: matrix.terraform_version == '1.15.8'
        run: terraform test
